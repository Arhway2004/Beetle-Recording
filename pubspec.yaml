name: beetle_keeper
description: "Beetle Keeper AI - offline-first beetle breeding manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0

  # Persistence (SQLite via Drift)
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.2
  crypto: ^3.0.7
  archive: ^4.5.2
  http: ^1.6.0

  # On-device AI (llama.cpp). The package's build hook fetches and bundles the
  # native runtime. The SwiftPM companion (llamadart_llama_cpp_flutter) is not
  # used: Flutter 3.38 builds its generated plugin package for iOS 13 while the
  # companion requires iOS 16.4. See docs/architecture/mobile-ai.md.
  llamadart: ^0.11.1

  # UI
  # 1.1.x needs a newer vector_math than Flutter 3.29 ships (Matrix4.translateByDouble).
  fl_chart: 1.0.0
  cupertino_icons: ^1.0.8

  # Platform integrations
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1  # 5.x needs Kotlin Gradle Plugin >= 2.x
  flutter_secure_storage: ^9.2.4  # 10.x needs compileSdk 36
  image_picker: ^1.2.1
  file_picker: ^11.0.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    # Copy of packages/api-contracts/schemas (kept identical by a test).
    - assets/schemas/
