targets:
  $default:
    builders:
      drift_dev:
        options:
          # Used by `dart run drift_dev make-migrations` to export schema snapshots and
          # generate migration tests. Never edit files in drift_schemas/ by hand.
          databases:
            app_database: lib/data/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
          store_date_time_values_as_text: false
          sql:
            dialect: sqlite
            options:
              version: "3.38"
